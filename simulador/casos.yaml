# Casos de teste do simulador.
# Cada caso é uma conversa (lista de mensagens do cliente). As verificações valem para a ÚLTIMA resposta,
# exceto ficha/transferiu/motivo, que olham o estado final do lead.
#
# Verificações disponíveis:
#   cita:           todos estes termos aparecem na resposta (sem acento, minúsculo)
#   cita_algum:     pelo menos um destes termos aparece
#   nao_cita:       nenhum destes termos aparece
#   transferiu:     true/false
#   motivo:         motivo da transferência
#   ficha:          campos esperados na ficha do lead
#   bloqueio_entrada: categoria esperada no guardrail de entrada, lista de categorias aceitas,
#                   ou false para "não bloqueou"
#   resposta_audio: true se a resposta deve sair em áudio
#   ultima_ignorada: motivo esperado para a última mensagem não ter resposta (ex.: com_humano)
#   status:         status final do lead atual do número (bot | humano | parado)
#   no_turno:       [{turno: N, cita_algum: [...]}] a resposta do turno N precisa citar algum dos termos
#   depois_do_turno: [{turno: N, nao_cita: [...]}] respostas a partir do turno N+1 não podem conter os termos
#                   (usado para garantir que o agente não volta em pergunta já respondida)
#
# Estoque de referência (20 carros) em app/db/estoque.csv.

- id: 1-suv-troca-financiamento
  descricao: "SUV até 120 mil, Gol 2018 na troca, quer financiar"
  esperado: "Mostrar só os SUVs dentro do valor, registrar a troca e não prometer crédito."
  mensagens:
    - "Quero um SUV até 120 mil, tenho um Gol 2018 pra troca e quero financiar."
  verificar:
    # SUVs até 120 mil no estoque: Creta, T-Cross, Kicks, Duster (o agente mostra até 3)
    cita_algum: ["creta", "t-cross", "kicks", "duster"]
    nao_cita: ["compass", "hr-v", "corolla cross", "civic", "onix", "polo", "aprovad", "garantid"]
    ficha: { troca_tem: true, quer_financiar: true, preco_max: 120000 }
    bloqueio_entrada: false

- id: 2-hilux
