  verificar:
    cita_algum: ["nao temos", "não temos", "nao tenho", "não tenho", "no momento", "infelizmente"]
    # alternativa do estoque: as picapes são as mais próximas, mas qualquer carro do estoque vale
    cita_algum_2: ["toro", "s10", "ranger", "compass", "corolla cross", "hr-v", "creta", "t-cross", "kicks",
                   "duster", "corolla", "civic", "sentra"]
    transferiu: false

