- id: c19-gostou-de-algum-antes-de-seguir
  descricao: "Depois da lista, perguntar se gostou de algum antes da forma de pagamento"
  esperado: "Mostrar os SUVs, perguntar se gostou de algum; quando ele escolher, comentar o carro sem repetir a lista e só então perguntar à vista ou financiado."
  mensagens:
    - "Quero um SUV até 120 mil"
    - "Gostei do Kicks"
    - "À vista"
    - "Amanhã à tarde"
  verificar:
    transferiu: true
    motivo: qualificado
    ficha: { tipo_interesse: SUV, preco_max: 120000, quer_financiar: false }
    no_turno:
      - { turno: 1, cita_algum: ["gostou", "curtiu", "interessou", "chamou sua atencao", "agradou"] }
      - { turno: 2, cita_algum: ["a vista", "financ"] }
    depois_do_turno:
      - { turno: 1, nao_cita: ["duster", "creta", "t-cross"] }
    lista_em_ordem_de_preco: true

- id: c20-nao-gostou-de-nenhum
  descricao: "Depois da lista, o cliente não gosta de nenhum"
  esperado: "Não seguir o checklist nem qualificar: perguntar o que ele procura de diferente."
  mensagens:
    - "Quero um hatch até 80 mil"
    - "Não gostei de nenhum desses"
  verificar:
    transferiu: false
    status: bot
    no_turno:
      - { turno: 1, cita_algum: ["gostou", "curtiu", "interessou", "chamou sua atencao", "agradou"] }
      - { turno: 2, cita_algum: ["procura", "diferente", "prefer", "gostaria", "outro", "busca", "importante"] }

- id: c21-sedan-escrito-sedan
  descricao: "Cliente escreve 'sedan' (e não 'sedã')"
  esperado: "Entender como sedã: nunca mostrar hatch dizendo que é sedã. Com as respostas e o dia da visita, passar de verdade para o vendedor."
  mensagens:
    - "queria comprar um sedan"
    - "70 mil"
    - "pagar a vista"
    - "sabado de manha"
  verificar:
    ficha: { tipo_interesse: Sedã, preco_max: 70000, quer_financiar: false }
    transferiu: true
    motivo: qualificado
    no_turno:
      - { turno: 1, cita_algum: ["quanto", "investir", "valor", "orcamento"] }
    depois_do_turno:
      - { turno: 0, nao_cita: ["kwid", "hb20", "argo"] }

# ---------- Respostas da Autoconf (persona, qualificação até a visita, transbordo, lista) ----------

- id: a1-vender-o-carro
  descricao: "Cliente quer vender o carro dele para a loja"
  esperado: "Perguntar o carro (modelo e ano) e o dia para trazer à avaliação, sem dizer valor; com o dia, passar para o vendedor."
  mensagens:
    - "Oi, vocês compram carro? Quero vender o meu"
    - "É um Gol 2018"
    - "Consigo levar sábado de manhã"
  verificar:
    ficha: { intencao: vender, troca_ano: 2018 }
    transferiu: true
    motivo: qualificado
    no_turno:
      - { turno: 1, cita_algum: ["modelo", "qual carro", "qual e o carro", "que carro", "ano"] }
      - { turno: 2, cita_algum: ["avalia", "loja", "trazer", "dia", "passar"] }
    depois_do_turno:
      - { turno: 0, nao_cita: ["r$", "suv", "hatch"] }

- id: a2-quanto-pagam-no-meu
  descricao: "Cliente pergunta quanto a loja paga no carro dele"
  esperado: "Não estimar valor nenhum e passar para o vendedor (negociação)."
  mensagens:
    - "Quero um SUV até 120 mil"
    - "Quanto vocês pagam no meu Onix 2019 na troca?"
  verificar:
    transferiu: true
    motivo: negociacao
    no_turno:
      - { turno: 2, cita_algum: ["vendedor", "avalia"] }
    nao_cita: ["r$", "fipe", "mil no seu"]

- id: a3-nao-sabe-responder-garantia
  descricao: "Cliente pergunta algo que o estoque não tem (garantia)"
  esperado: "Não inventar: dizer que confirma com o vendedor e passar a conversa."
  mensagens:
    - "Quero um SUV até 120 mil"
    - "O Creta tem garantia?"
  verificar:
    transferiu: true
    motivo: sem_resposta
    nao_cita: ["meses de garantia", "ano de garantia", "tem garantia sim", "garantia de fabrica"]

- id: a4-nao-sabe-responder-historico
  descricao: "Cliente pergunta se o carro já foi batido"
  esperado: "Não inventar o histórico do carro e passar para o vendedor."
  mensagens:
    - "Esse Kicks já foi batido?"
  verificar:
    transferiu: true
    motivo: sem_resposta
    nao_cita: ["nunca foi batido", "nao foi batido", "sem batida"]

- id: a5-modelo-sem-estoque-pede-a-faixa
  descricao: "Modelo que não existe: sugerir parecido e pedir a faixa de preço para dar mais opções"
  esperado: "Dizer que não tem, sugerir 1 ou 2 parecidos e perguntar o valor; com o valor, mostrar o que cabe."
  mensagens:
    - "Vocês têm Jeep Renegade?"
    - "Até uns 120 mil"
  verificar:
    no_turno:
      - { turno: 1, cita_algum: ["nao temos", "nao tenho", "no momento", "infelizmente"] }
      - { turno: 1, cita_algum: ["ate quanto", "quanto", "investir", "orcamento", "valor", "faixa"] }
      - { turno: 2, cita_algum: ["creta", "t-cross", "kicks", "duster"] }
    lista_em_ordem_de_preco: true

- id: a6-visita-antes-das-perguntas
  descricao: "Cliente já fala em ir à loja antes de responder tudo"
  esperado: "Anotar o dia sem barrar a conversa e seguir com o que falta; só passar para o vendedor no fim."
  mensagens:
    - "Quero ver um hatch até 80 mil, posso passar aí sábado?"
    - "À vista"
  verificar:
    ficha: { tipo_interesse: Hatch, preco_max: 80000, quer_financiar: false }
    transferiu: true
    motivo: qualificado

- id: c01-valor-80k
  descricao: "Valor escrito como '80k'"
  esperado: "Entender 80k como R$ 80.000 e não perguntar o valor de novo."
  mensagens:
    - "Quero um hatch"
    - "80k"
  verificar:
    ficha: { tipo_interesse: Hatch, preco_max: 80000 }
    status: bot
    no_turno:
      - { turno: 2, cita_algum: ["a vista", "financ", "gostou", "curtiu", "interessou"] }
    depois_do_turno:
      - { turno: 2, nao_cita: ["ate quanto", "quanto pretende", "quanto quer investir", "qual seu orcamento"] }

- id: c02-valor-gíria-conto
  descricao: "Valor em gíria ('uns 80 conto')"
  esperado: "Entender 'conto' como mil reais."
  mensagens:
    - "Tô atrás de um sedã, tenho uns 80 conto"
  verificar:
    ficha: { tipo_interesse: Sedã, preco_max: 80000 }
    cita_algum: ["cronos"]
    nao_cita: ["corolla", "civic", "sentra"]

- id: c03-faixa-de-valor
  descricao: "Faixa de preço ('entre 60 e 80 mil')"
  esperado: "Gravar mínimo e máximo e mostrar só carros dentro da faixa."
  mensagens:
    - "Quero um hatch entre 60 e 80 mil"
  verificar:
    ficha: { preco_min: 60000, preco_max: 80000 }
    cita_algum: ["hb20", "argo", "onix"]
    nao_cita: ["kwid", "polo"]

- id: c04-valor-formatado
  descricao: "Valor escrito com R$ e pontos"
  esperado: "Entender 'R$ 100.000' e 'no máximo' como teto."
  mensagens:
    - "SUV de no máximo R$ 100.000"
  verificar:
    ficha: { tipo_interesse: SUV, preco_max: 100000 }
    cita: ["duster", "kicks"]
    nao_cita: ["creta", "t-cross", "compass"]

- id: c05-pagamento-parcelado
  descricao: "Forma de compra como 'parcelado'"
  esperado: "Entender parcelado como financiado e qualificar."
  mensagens:
    - "Quero um SUV até 120 mil"
    - "Vou fazer parcelado"
    - "Dá pra eu ir aí quinta à noite?"
  verificar:
    ficha: { quer_financiar: true }
    transferiu: true
    motivo: qualificado

- id: c06-pagamento-misto
  descricao: "Parte à vista e parte financiada"
  esperado: "Entender como financiamento (com entrada) e qualificar sem prometer crédito."
  mensagens:
    - "Quero um sedã até 130 mil"
    - "Dou metade à vista e financio o resto"
    - "Sábado de manhã"
  verificar:
    ficha: { quer_financiar: true }
    transferiu: true
    motivo: qualificado
    nao_cita: ["aprovado", "garantido"]

- id: c07-pagamento-a-vista-informal
  descricao: "À vista escrito de forma informal ('pago no dinheiro')"
  esperado: "Entender como à vista."
  mensagens:
    - "Quero uma picape até 170 mil"
    - "pago no dinheiro, sem financiamento"
    - "amanha de tarde"
  verificar:
    ficha: { quer_financiar: false, preco_max: 170000 }
    transferiu: true
    motivo: qualificado

- id: c08-modelo-pela-marca
  descricao: "Interesse dito pela marca ('um Jeep')"
  esperado: "Mostrar o Jeep do estoque e perguntar o que falta, sem perguntar o tipo."
  mensagens:
    - "Tem algum Jeep?"
  verificar:
    cita: ["compass"]
    nao_cita: ["que tipo de carro", "qual tipo"]

- id: c09-modelo-pelo-perfil
  descricao: "Interesse dito pelo perfil ('pequeno e econômico')"
  esperado: "Não inventar o tipo: perguntar ou sugerir hatch, sem qualificar."
  mensagens:
    - "Quero um carro pequeno e econômico pra cidade"
  verificar:
    status: bot
    cita_algum: ["hatch", "kwid", "onix", "argo", "hb20", "polo", "tipo"]

- id: c10-fora-de-ordem
  descricao: "Cliente responde primeiro o pagamento, depois o valor, depois o modelo"
  esperado: "Aceitar a ordem do cliente, não repetir nada e qualificar no fim."
  mensagens:
    - "Vou financiar"
    - "Uns 90 mil"
    - "Um hatch"
    - "Gostei do Polo, consigo ir sábado"
  verificar:
    ficha: { quer_financiar: true, preco_max: 90000, tipo_interesse: Hatch }
    transferiu: true
    motivo: qualificado
    depois_do_turno:
      - { turno: 1, nao_cita: ["a vista ou", "vai financiar", "pensa em financiar"] }
      - { turno: 2, nao_cita: ["ate quanto", "quanto pretende", "quanto quer investir"] }

- id: c11-tudo-numa-frase-informal
  descricao: "As 3 respostas numa frase, com erros de digitação"
  esperado: "Entender tudo na hora, mostrando os carros; com o dia da visita, qualificar."
  mensagens:
    - "qero um suv ate 100 mil a vista"
    - "gostei do kicks, posso ir amanha cedo"
  verificar:
    ficha: { tipo_interesse: SUV, preco_max: 100000, quer_financiar: false }
    transferiu: true
    motivo: qualificado
    no_turno:
      - { turno: 1, cita_algum: ["duster", "kicks"] }

- id: c12-cliente-corrige-o-valor
  descricao: "Cliente corrige o valor depois"
  esperado: "Atualizar a ficha com o valor novo e mostrar os carros da nova faixa."
  mensagens:
    - "Quero um SUV até 90 mil"
    - "Na verdade consigo chegar em 120 mil"
  verificar:
    ficha: { preco_max: 120000 }
    no_turno:
      - { turno: 2, cita_algum: ["creta", "t-cross"] }

- id: c13-nao-sabe-o-valor
  descricao: "Cliente não sabe o valor"
  esperado: "Aceitar, seguir para a forma de compra e NÃO qualificar sem o valor."
  mensagens:
    - "Quero um SUV"
    - "Ainda não sei quanto quero gastar"
    - "Vou pagar à vista"
  verificar:
    transferiu: false
    status: bot
    depois_do_turno:
      - { turno: 2, nao_cita: ["ate quanto", "quanto pretende", "quanto quer investir", "qual seu orcamento"] }

- id: c14-pergunta-no-meio
  descricao: "Cliente faz uma pergunta no meio da coleta"
  esperado: "Responder a pergunta (preço do carro) e continuar a coleta de onde parou."
  mensagens:
    - "Quero um SUV"
    - "Quanto tá o T-Cross?"
  verificar:
    cita: ["118.500"]
    status: bot
    no_turno:
      - { turno: 2, cita_algum: ["ate quanto", "quanto", "orcamento", "investir", "a vista", "financ"] }

- id: c15-audio-com-as-3
  descricao: "Áudio com as 3 respostas"
  esperado: "Entender pelo áudio, qualificar e responder em áudio."
  mensagens:
    - { tipo: audio, transcricao: "Oi, eu tô procurando um sedã, até uns cento e trinta mil, e vou financiar" }
    - { tipo: audio, transcricao: "Gostei do Corolla. Consigo passar aí no sábado de manhã" }
  verificar:
    ficha: { tipo_interesse: Sedã, quer_financiar: true }
    transferiu: true
    motivo: qualificado
    resposta_audio: true

- id: c16-resposta-curta-sim
  descricao: "Resposta curta que depende da pergunta ('sim' para financiar)"
  esperado: "Usar o contexto: 'sim' depois de 'pensa em financiar?' vale como financiar."
  mensagens:
    - "Quero um hatch até 70 mil"
    - "Vai ser financiado sim"
    - "sexta de tarde"
  verificar:
    ficha: { quer_financiar: true }
    transferiu: true
    motivo: qualificado

# ---------- Comandos #reset, #parar e #thread ----------

- id: x28-parar-silencia
  descricao: "#parar no meio da conversa"
  esperado: "Confirmar e não responder mais nada depois."
  mensagens:
    - "Quero um SUV até 120 mil"
    - "#parar"
    - "Ainda tá aí?"
    - "Me responde"
  verificar:
    status: parado
    ultima_ignorada: parado

- id: x29-parar-e-voltar-com-thread
  descricao: "#parar e depois #thread"
  esperado: "Voltar na mesma conversa, lembrando o que já foi dito (sem perguntar o valor de novo)."
  mensagens:
    - "Quero um sedã até 100 mil"
    - "#parar"
    - "Oi?"
    - "#thread voltei, quais vocês têm?"
  verificar:
    status: bot
    ficha: { preco_max: 100000 }
    cita_algum: ["onix plus", "cronos"]
    depois_do_turno:
      - { turno: 3, nao_cita: ["ate quanto", "quanto pretende", "qual seu orcamento", "qual o seu orcamento", "quanto quer investir"] }
    lista_em_ordem_de_preco: true
    nao_repete_comentario: true

- id: x30-reset-comeca-do-zero
  descricao: "#reset e nova conversa no mesmo número"
  esperado: "Esquecer tudo da conversa anterior e começar uma nova."
  mensagens:
    - "Meu nome é Rafael, quero um SUV até 120 mil"
    - "#reset"
    - "Oi"
  verificar:
    status: bot
    ficha: { preco_max: null, tipo_interesse: null }
    nao_cita: ["rafael", "120"]

- id: x31-reset-depois-de-transferido
  descricao: "#reset com a conversa já com vendedor"
  esperado: "Liberar o número: a conversa nova volta a ser atendida pelo bot."
  mensagens:
    - "Fecho no Corolla se fizer 115 mil"
    - "#reset"
    - "Oi, tem hatch?"
  verificar:
    status: bot
    transferiu: false
    cita_algum: ["onix", "argo", "polo", "hb20", "kwid"]

- id: x32-parar-durante-transferido
  descricao: "#parar com a conversa já com vendedor"
  esperado: "Parar o bot; mensagens seguintes só ficam gravadas."
  mensagens:
    - "Quero falar com um atendente de verdade"
    - "#parar"
    - "Alguém?"
  verificar:
    status: parado
    ultima_ignorada: parado

- id: x33-thread-sozinho
  descricao: "Cliente manda só #thread"
  esperado: "Tratar como um oi: se apresentar e perguntar como pode ajudar, sem ficar em silêncio."
  mensagens:
    - "#thread"
  verificar:
    transferiu: false
    cita: ["lia", "como posso te ajudar"]

- id: x34-reset-e-parar-juntos
  descricao: "#reset e #parar na mesma mensagem"
  esperado: "O reset ganha: conversa nova, bot ativo."
  mensagens:
    - "Quero um SUV"
    - "#parar #reset"
    - "Oi"
  verificar:
    status: bot
    ficha: { tipo_interesse: null }
