  verificar:
    transferiu: true
    motivo: qualificado
    ficha: { tipo_interesse: SUV, preco_max: 110000, quer_financiar: true }
    depois_do_turno:
      - { turno: 3, nao_cita: ["que tipo de carro", "qual tipo"] }
      - { turno: 4, nao_cita: ["ate quanto", "quanto pretende", "orcamento", "quanto quer investir", "quanto voce pensa"] }
